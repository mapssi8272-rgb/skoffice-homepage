# 네이버 블로그 새 글을 하루 3번 가져와 홈페이지 "블로그 소식" 칸을 새로 고친다.
# GitHub 시간은 한국 시간보다 9시간 느린 UTC 기준이다.
#   한국 08:00 = UTC 23:00 (전날)
#   한국 13:00 = UTC 04:00
#   한국 19:00 = UTC 10:00
# GitHub가 바쁠 때는 몇 분에서 수십 분 늦게 돌기도 한다.
name: 블로그 새 글 가져오기

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 블로그 글 가져오기
        run: node scripts/fetch-blog.mjs

      - name: 바뀐 것이 있으면 올리기
        id: commit
        run: |
          git add blog-posts.js images/blog
          if git diff --cached --quiet; then
            echo "새 글 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "블로그 새 글 반영"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 홈페이지 다시 만들기
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages가 이미 다시 만드는 중"
